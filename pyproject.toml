[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batataswap"
version = "0.1.0"
description = "Memória compartilhada entre contas Claude via MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "mcp>=2.2,<3",
    "cryptography",
    "segno",
    "httpx2==2.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pip-tools",
]

[tool.hatch.build.targets.wheel]
packages = ["src/batataswap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
